        .filter-row label { font-weight:600; font-size:14px; min-width:40px; }
        .filter-row input { flex:1; padding:8px 10px; border-radius:8px; border:1px solid #ddd; font-size:14px; min-width:80px; }
        .filter-row input:focus { border-color:#1a73e8; outline:none; }
        .stats { font-size:13px; color:#666; margin-bottom:8px; text-align:center; }
        .house-list { display:flex; flex-direction:column; gap:10px; }
        .house-card { background:white; border-radius:12px; padding:12px 14px; box-shadow:0 2px 6px rgba(0,0,0,0.06); border-left:4px solid #1a73e8; }
        .house-card .title { font-weight:700; font-size:16px; margin-bottom:4px; }
        .house-card .detail { font-size:14px; color:#555; margin-bottom:2px; line-height:1.4; }
        .house-card .contact { color:#d93025; font-weight:600; margin-top:4px; }
        .no-result { text-align:center; color:#999; padding:30px 0; font-size:16px; }
    </style>
</head>

    const minRentInput = document.getElementById('minRent');
    const maxRentInput = document.getElementById('maxRent');
    const layoutFilter = document.getElementById('layoutFilter');
    const communityFilter = document.getElementById('communityFilter');
    const noteFilter = document.getElementById('noteFilter');
    const statsDiv = document.getElementById('stats');
    const houseListDiv = document.getElementById('houseList');
    const noResultDiv = document.getElementById('noResult');
    function render() {
        const minRent = parseInt(minRentInput.value) || 0;
        const maxRent = parseInt(maxRentInput.value) || 999999;
        const layoutKw = layoutFilter.value.trim().toLowerCase();
        const communityKw = communityFilter.value.trim().toLowerCase();
        const noteKw = noteFilter.value.trim().toLowerCase();
        const filtered = houses.filter(h => {
            const rent = h.月租金 || 0;
            if (rent < minRent || rent > maxRent) return false;
            if (layoutKw && !(h.户型及说明 || '').toLowerCase().includes(layoutKw)) return false;
            if (communityKw && !(h.小区名称 || '').toLowerCase().includes(communityKw)) return false;
            if (noteKw && !(h.户型及说明 || '').toLowerCase().includes(noteKw)) return false;
            return true;
        });
        statsDiv.textContent = `共 ${filtered.length} 条房源`;
        houseListDiv.innerHTML = '';
        noResultDiv.style.display = filtered.length === 0 ? 'block' : 'none';
        filtered.forEach(h => {
            const card = document.createElement('div');
            card.className = 'house-card';
            card.innerHTML = `<div class="title">${h.小区名称 || '未知'} · ${h.月租金 || '?'}元/月</div><div class="detail">${h.户型及说明 || ''}</div>${h.联系方式 ? `<div class="contact">📞 ${h.联系方式}</div>` : ''}`;
            houseListDiv.appendChild(card);
        });
    }
    [minRentInput, maxRentInput, layoutFilter, communityFilter, noteFilter].forEach(el => el.addEventListener('input', render));
    render();
